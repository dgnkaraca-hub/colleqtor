<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>colleqtor — Yaşayan Koleksiyon &amp; Dijital Arşiv</title>

    <!-- SEO -->

      content="colleqtor, antika nesneler, özel koleksiyonlar, çizimler, tekstiller ve kültürel objeler için yaşayan bir dijital arşiv ve koleksiyon platformudur."
    />
    <link rel="canonical" href="https://colleqtor.example/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="colleqtor" />
    <meta
      property="og:title"
      content="colleqtor — Yaşayan Koleksiyon &amp; Dijital Arşiv"
    />
    <meta
      property="og:description"
      content="colleqtor, antika nesneler, özel koleksiyonlar, çizimler, tekstiller ve kültürel objeler için yaşayan bir dijital arşiv ve koleksiyon platformudur."
    />
    <meta property="og:image" content="/logo/colleqtor-lockup.svg" />
    <meta property="og:url" content="https://colleqtor.example/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="colleqtor — Yaşayan Koleksiyon &amp; Dijital Arşiv"
    />
    <meta
      name="twitter:description"
      content="colleqtor, antika nesneler, özel koleksiyonlar, çizimler, tekstiller ve kültürel objeler için yaşayan bir dijital arşiv ve koleksiyon platformudur."
    />
    <meta name="twitter:image" content="/logo/colleqtor-lockup.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Netlify Forms detection target. Netlify parses static HTML at deploy
      time, so the SPA's JS-rendered form is invisible to it — this hidden
      mirror declares the form name and fields. The React form on /iletisim
      POSTs url-encoded data to "/" with form-name=iletisim.
    -->
    <form
      name="iletisim"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="iletisim" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="object" />
      <input type="text" name="objectId" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
